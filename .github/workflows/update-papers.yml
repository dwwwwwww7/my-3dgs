name: Update Papers

on:
  schedule:
    - cron: '0 0 * * 0'  # 每周日 UTC 0:00 自动运行
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write          # 允许推送代码更改

jobs:
  update:
    runs-on: ubuntu-latest
    env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install arxiv requests urllib3 markdown

    - name: 验证搜索配置
      run: |
        echo "🔍 验证搜索配置文件..."
        python validate_search_config.py
      working-directory: ./scripts
        
    - name: 验证必要文件
      run: |
        echo "📁 检查必要文件..."
        ls -la data/
        test -f data/keywords.json || { echo "❌ keywords.json 文件不存在"; exit 1; }
        test -f data/search_config.json || { echo "❌ search_config.json 文件不存在"; exit 1; }
        echo "✅ 所有必要文件存在"
        
    - name: 运行爬虫 
      run: |
        echo "🕷️ 开始运行爬虫..."
        python -c "from utils.logger import setup_logger; setup_logger('workflow')"
        python arxiv_crawler.py --max-results 600  #设置最多检索600篇文献，避免触发API限制
        echo "✅ 爬虫运行完成"
      working-directory: ./scripts 
        
    - name: 验证爬虫输出
      run: |
        echo "📊 验证爬虫输出..."
        ls -la data/papers_*.json || { echo "❌ 没有生成论文数据文件"; exit 1; }
        echo "✅ 论文数据文件生成成功"
        
    - name: 更新README
      run: |
        echo "📝 更新 README..."
        python readme_generator.py \
          --data-dir ../data \
          --output ../README.md \
          --update-dir ../update    #\
          #--translate   #控制摘要翻译，--translate为开启                           
        echo "✅ README 更新完成"
      working-directory: ./scripts         
        
    - name: 检查是否有更改
      id: verify-changed-files
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "📈 检测到更改，准备提交"
        else
          echo "has_changes=false" >> $GITHUB_OUTPUT
          echo "📊 没有检测到更改"
        fi

    - name: 获取更新日志内容
      if: steps.verify-changed-files.outputs.has_changes == 'true'
      id: get-update-content
      run: |
         LATEST_UPDATE=$(ls -t update/update_*.md | head -n 1)
         if [ -z "$LATEST_UPDATE" ]; then
           echo "❌ 未找到任何更新日志文件"
           echo "CONTENT=" >> $GITHUB_OUTPUT
            exit 0
         fi
         echo "📄 找到最新更新日志: $LATEST_UPDATE"

         # 从文件名中提取日期 (格式: update_20250821.md)
         UPDATE_DATE=$(basename "$LATEST_UPDATE" | sed 's/update_//;s/\.md//')
    
         # 格式化日期为 YYYY-MM-DD
         FORMATTED_DATE=$(echo "$UPDATE_DATE" | sed -E 's/([0-9]{4})([0-9]{2})([0-9]{2})/\1-\2-\3/')

         # 获取文件内容
         MD_CONTENT=$(cat "$LATEST_UPDATE")
         HTML_CONTENT=$(python -c "import markdown; print(markdown.markdown('''$MD_CONTENT'''))")

         # 🌟 新增：提取数量并判断是否需要发送邮件
         # 使用grep和sed提取"新增论文数量："和"更新论文数量："后的数字
         ADD_COUNT=$(echo "$MD_CONTENT" | grep -oP '新增论文数量\*\*:\s*\K\d+' || echo 0)
         CHANGE_COUNT=$(echo "$MD_CONTENT" | grep -oP '变动论文数量\*\*:\s*\K\d+' || echo 0)
    
         # 如果有新增或变动论文则标记为需要发送
         if [ "$ADD_COUNT" -gt 0 ] || [ "$CHANGE_COUNT" -gt 0 ]; then
             SHOULD_SEND=1
         fi

         # 设置输出变量
         echo "FORMATTED_DATE=$FORMATTED_DATE" >> $GITHUB_OUTPUT
         echo "HTML_CONTENT<<EOF" >> $GITHUB_OUTPUT
         echo "$HTML_CONTENT" >> $GITHUB_OUTPUT
         echo "EOF" >> $GITHUB_OUTPUT
         echo "SHOULD_SEND=$SHOULD_SEND" >> $GITHUB_OUTPUT

         echo "✅ Markdown已转换为HTML，发送标志: $SHOULD_SEND (新增:$ADD_COUNT, 变动:$CHANGE_COUNT)"       
      env:
         TZ: Asia/Shanghai


    - name: 发送更新日志到邮箱 只有自动触发或手动触发有更新时才会发送邮件
      if: 
        ( github.event_name == 'schedule' || steps.get-update-content.outputs.SHOULD_SEND == '1') &&     
        steps.verify-changed-files.outputs.has_changes == 'true' && 
        steps.get-update-content.outputs.HTML_CONTENT != '' 
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: ${{ secrets.SMTP_SERVER }}    # SMTP服务器地址
        server_port: ${{ secrets.SMTP_PORT }}         # SMTP端口
        username: ${{ secrets.SMTP_USER }}            # SMTP用户名
        password: ${{ secrets.SMTP_PASSWORD }}        # SMTP密码/授权码
        subject:  "📚 3DGS论文更新日志  ${{ steps.get-update-content.outputs.FORMATTED_DATE }}"
        html_body: ${{ steps.get-update-content.outputs.HTML_CONTENT }}
        convert_markdown: true 
        to: ${{ secrets.EMAIL_RECEIVER }}             # 接收邮件的地址
        from: GitHub Actions                          # 发件人名称
      continue-on-error: true     # 即使发送失败也继续

        
    - name: 提交更改
      if: steps.verify-changed-files.outputs.has_changes == 'true'
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add data/ README.md update_log.md update/
        git commit -m "🤖 自动更新: $(date +'%Y-%m-%d %H:%M UTC')" 
        
    - name: 推送更改
      if: steps.verify-changed-files.outputs.has_changes == 'true'
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.REPO_PUSH_TOKEN }}
        branch: ${{ github.ref }} 
  
        
    - name: 工作流程完成通知
      run: |
        if [ "${{ steps.verify-changed-files.outputs.has_changes }}" == "true" ]; then
          echo "🎉 工作流程完成！已更新并推送更改。"
        else
          echo "✅ 工作流程完成！没有新的更改需要提交。"
        fi
