name: Update Papers

on:
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 0:00 运行
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write          # 允许推送代码更改

jobs:
  update:
    runs-on: ubuntu-latest
    env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install arxiv requests urllib3
        
    - name: 验证必要文件
      run: |
        echo "📁 检查必要文件..."
        ls -la data/
        test -f data/keywords.json || { echo "❌ keywords.json 文件不存在"; exit 1; }
        test -f data/search_config.json || { echo "❌ search_config.json 文件不存在"; exit 1; }
        echo "✅ 所有必要文件存在"
        
    - name: 运行爬虫 
      run: |
        echo "🕷️ 开始运行爬虫..."
        python -c "from utils.logger import setup_logger; setup_logger('workflow')"
        python arxiv_crawler.py
        echo "✅ 爬虫运行完成"
      working-directory: ./scripts 
        
    - name: 验证爬虫输出
      run: |
        echo "📊 验证爬虫输出..."
        ls -la data/papers_*.json || { echo "❌ 没有生成论文数据文件"; exit 1; }
        echo "✅ 论文数据文件生成成功"
        
    - name: 更新README
      run: |
        echo "📝 更新 README..."
        python readme_generator.py \
          --data-dir ../data \
          --output ../README.md \
          --update-dir ../update \
          --translate
        echo "✅ README 更新完成"
      working-directory: ./scripts         
        
    - name: 检查是否有更改
      id: verify-changed-files
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "📈 检测到更改，准备提交"
        else
          echo "has_changes=false" >> $GITHUB_OUTPUT
          echo "📊 没有检测到更改"
        fi

    - name: 发送更新日志到GitHub邮箱
      if: steps.verify-changed-files.outputs.has_changes == 'true'
      run: |
        echo "📧 准备发送更新日志到GitHub邮箱..."
        
        # 获取当天日期
        TODAY=$(date +'%Y-%m-%d')
        
        # 查找最新的更新日志文件
        LATEST_UPDATE=$(ls -t update/update_*.md | head -n 1)
        if [ -z "$LATEST_UPDATE" ]; then
          echo "❌ 未找到任何更新日志文件"
          exit 0
        fi
        echo "📄 找到最新更新日志: $LATEST_UPDATE"
        
        # 获取更新日志内容
        UPDATE_CONTENT=$(cat "$UPDATE_FILE")
        
        # 构造邮件主题和内容
        SUBJECT="📚 3DGS论文更新日志 - $TODAY"
        BODY=$(echo -e "以下是今天的论文更新日志：\n\n$UPDATE_CONTENT\n\n-- 自动生成，请勿回复 --")
        
        # 发送到GitHub通知邮箱（使用GitHub的私密通知地址）
        curl -X POST \
          -H "Authorization: token ${{ secrets.REPO_PUSH_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/user/emails \
          -d "{\"emails\": [\"${{ github.actor }}@users.noreply.github.com\"], \"subject\": \"$SUBJECT\", \"body\": \"$BODY\"}"
        
        echo "✅ 更新日志已发送到您的GitHub通知邮箱"
      env:
        TZ: Asia/Shanghai
      continue-on-error: true  # 即使发送失败也继续
        


        
    - name: 提交更改
      if: steps.verify-changed-files.outputs.has_changes == 'true'
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add data/ README.md update_log.md update/
        git commit -m "🤖 自动更新: $(date +'%Y-%m-%d %H:%M UTC')" 
        
    - name: 推送更改
      if: steps.verify-changed-files.outputs.has_changes == 'true'
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.REPO_PUSH_TOKEN }}
        branch: ${{ github.ref }} 
  
        
    - name: 工作流程完成通知
      run: |
        if [ "${{ steps.verify-changed-files.outputs.has_changes }}" == "true" ]; then
          echo "🎉 工作流程完成！已更新并推送更改。"
        else
          echo "✅ 工作流程完成！没有新的更改需要提交。"
        fi
