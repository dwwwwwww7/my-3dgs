name: 3D Gaussian Splatting 论文自动更新

on:
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 0:00 运行
  workflow_dispatch:      # 允许手动触发

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置 Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 tqdm pytz
        pip list
        
    - name: 创建必要目录
      run: |
        echo "创建数据目录..."
        mkdir -p data
        ls -la
        
    - name: 运行爬虫脚本
      run: |
        echo "🕷️ 开始运行 arXiv 爬虫..."
        python arxiv_crawler.py
        echo "✅ 爬虫运行完成"
        echo "爬虫输出文件:"
        ls -l data/
        
    - name: 验证爬虫输出
      run: |
        echo "📊 验证爬虫输出..."
        test -f data/papers_*.json || { echo "❌ 没有生成论文数据文件"; exit 1; }
        echo "✅ 论文数据文件生成成功"
        
    - name: 更新 README
      run: |
        echo "📝 开始更新 README..."
        python readme.py
        echo "✅ README 更新完成"
        echo "README 文件状态:"
        ls -l README.md
        
    - name: 检查是否有更改
      id: verify-changed-files
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "📈 检测到更改，准备提交"
          git status
          git diff --cached
        else
          echo "has_changes=false" >> $GITHUB_OUTPUT
          echo "📊 没有检测到更改"
        fi
        
    - name: 提交更改
      if: steps.verify-changed-files.outputs.has_changes == 'true'
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add data/ README.md
        git commit -m "🤖 自动更新论文列表: $(date +'%Y-%m-%d %H:%M UTC')"
        
    - name: 推送更改
      if: steps.verify-changed-files.outputs.has_changes == 'true'
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: main  # 或者 ${{ github.ref }}
        
    - name: 工作流程完成通知
      run: |
        if [ "${{ steps.verify-changed-files.outputs.has_changes }}" == "true" ]; then
          echo "🎉 工作流程完成！已更新并推送更改。"
        else
          echo "✅ 工作流程完成！没有新的更改需要提交。"
        fi
```

### 关键配置说明：

1. **Python 3.11 支持**：
   ```yaml
   with:
     python-version: '3.11'
   ```
   确保使用您指定的 Python 版本

2. **依赖安装**：
   ```yaml
   pip install requests beautifulsoup4 tqdm pytz
   ```
   包含了爬虫和 README 生成器可能需要的基础库

3. **目录处理**：
   ```yaml
   - name: 创建必要目录
     run: |
       echo "创建数据目录..."
       mkdir -p data
   ```
   确保 `data/` 目录存在，防止文件写入错误

4. **详细调试信息**：
   ```yaml
   echo "爬虫输出文件:"
   ls -l data/
   
   echo "README 文件状态:"
   ls -l README.md
   
   git status
   git diff --cached
   ```
   添加了多个调试输出，帮助排查"找不到文件"的问题

5. **分支设置**：
   ```yaml
   branch: main  # 或者 ${{ github.ref }}
